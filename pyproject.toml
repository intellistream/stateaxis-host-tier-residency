[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stateaxis-host-tier-residency"
version = "0.2.0"
description = "Bounded exact host-tier residency contract for StateAxis"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.12", "vllm-hust-ext==0.3.0.dev0"]

[project.entry-points."vllm_hust.extension_bundles"]
"org.vllm-hust.stateaxis-host-tier-residency" = "stateaxis_host_tier_residency"

[project.entry-points."stateaxis.mod_handlers"]
host_tier_residency = "stateaxis_host_tier_residency:host_tier_residency"

[tool.hatch.build.targets.wheel]
packages = ["src/stateaxis_host_tier_residency"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
